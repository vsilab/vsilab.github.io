# Regenerates the HTML pages from _data/ whenever something is committed to main,
# and commits the updated pages. GitHub Pages then publishes the main branch.
name: Build site
on:
  push:
    branches: [main]
    paths-ignore: ['*.html']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-site
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 _build/build.py --in-place
      - name: Commit regenerated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A *.html .nojekyll
          if git diff --cached --quiet; then echo "Pages already up to date"; else git commit -m "Rebuild pages" && git push; fi
