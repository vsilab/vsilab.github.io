# RESEARCH DIRECTIONS (home page and Research page)
#
# figure:  overview illustration shown on the home page (file in assets/figures/).
#          The three overview figures are drawn by _build/figures/make_figures.py.
# papers:  two or three related papers, copied exactly from the titles in
#          publications.yml, in the order to show them. Venue and year are added automatically.
#
# collaborations: partner groups listed at the bottom of the Research page
# ─────────────────────────────────────────────────────────────────────────────

directions:
  - id: multimodal
    title: Multimodal Perception and Decision Systems
    summary: "We build models that combine images, video, text, and clinical records, for example imaging with patient data for oral cancer detection and for predicting response to spinal cord stimulation. In ongoing robot work, a vision-language model updates a belief about an occluded target, and the robot acts on the scene and looks again until the evidence supports a grasp."
    topics:
      - Vision-language models and multimodal perception
      - Reliable multimodal reasoning under uncertainty in adaptive decision-making
      - Human-centered perception and decision support
      - Vision-language models for robot perception under partial observability
    figure: overview-multimodal.svg
    figure_alt: "Example inputs (image, video, text, patient data); a conceptual diagram combining images and clinical data into one prediction; and a real robot that cannot see the target, removes the cover, looks into the container, and grasps once the evidence suffices"
    papers:
      - "Prediction of Response to Spinal Cord Stimulation Using Machine Learning Based on Radiomics and Patient-Reported Outcomes"
      - "Multimodal Learning for Enhanced Detection in Oral Cancer Screening"

  - id: medical
    title: Medical Image and Video Understanding
    summary: "We analyze retinal photographs and OCT, surgical and endoscopic video, brain connectivity, and human movement. The difficulties are thin retinal layers that differ across scanners, surgical scenes with smoke, bleeding, reflections, and deforming tissue, and patterns spread over many brain regions. Recent work includes endoscope visual odometry, a surgical tool segmentation challenge, and graph models for autism detection."
    topics:
      - Foundation and self-supervised models for medical image interpretation
      - Ophthalmic AI for retinal imaging and clinical decision support
      - Surgical AI for workflow understanding and intelligent assistance
      - Human pose estimation and motion analysis from video
      - Graph learning on brain connectivity
    figure: overview-medical.svg
    figure_alt: "A fundus photograph with the five-level diabetic retinopathy scale, retinal layers in OCT, brain regions on an MNI template with their connectivity matrix, human pose keypoints across video frames, and an endoscope camera trajectory"
    papers:
      - "SegSTRONG-C: Segmenting Surgical Tools Robustly On Non-adversarial Generated 'Corruptions', an EndoVis'24 Challenge"
      - "RVO-MIS: Robust Visual Odometry for Minimally Invasive Surgery"
      - "Self-Supervised Graph Transformer with Contrastive Learning for Brain Connectivity Analysis towards Improving Autism Detection"

  - id: reliable
    title: Reliable and Efficient AI Systems
    summary: "Models must keep working when the data change, across imaging devices, weather, and developmental stages, and must fit limited hardware. We study test-time adaptation on unlabeled data, including a federated setting across distributed cameras, domain-shift mitigation for retinal grading, knowledge distillation and pruning for compact models, and efficient hyperspectral classification on resource-limited systems."
    topics:
      - Reliability under distribution and domain shift, including test-time adaptation
      - Knowledge distillation and compact models for resource-constrained deployment
      - Efficient adaptation of foundation models, with simulation and synthetic data
    figure: overview-reliable.svg
    figure_alt: "Conceptual diagrams: training and deployment data that differ by imaging device, weather, or developmental stage; a model that adapts on unlabeled test data before predicting; and a large teacher network distilled into a smaller student"
    papers:
      - "Efficient Hyperspectral Image Classification Using Discrete Cosine Transform on Limited-Resource Systems"
      - "BCG-Former: Toward Pareto-Efficient Hyperspectral Image Classification via Band-Contextual Gating"

collaborations:
