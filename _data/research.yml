# ─────────────────────────────────────────────────────────────────────────────
# RESEARCH DIRECTIONS (home page and Research page)
#
# figure:  overview illustration shown on the home page (file in assets/figures/).
#          The three overview figures are drawn by _build/figures/make_figures.py.
# papers:  two or three related papers, copied exactly from the titles in
#          publications.yml, in the order to show them. Venue and year are added automatically.
#
# collaborations: partner groups listed at the bottom of the Research page
# ─────────────────────────────────────────────────────────────────────────────

directions:
  - id: multimodal
    title: Multimodal Perception and Decision Systems
    summary: Multimodal models that combine images, video, audio, and text, and decide when the visual evidence is sufficient to act. Robots look again before acting, and clinical models defer when uncertain.
    topics:
      - Vision-language models and multimodal perception
      - Reliable multimodal reasoning under uncertainty in adaptive decision-making
      - Human-centered perception and decision support
      - Vision-language models for robot perception under partial observability
    figure: overview-multimodal.svg
    figure_alt: Example inputs (image, video, audio, text) with attention; compression ultrasound (DVT) and ocular B-scan views above a model-confidence scale, where cases below a reliability threshold are deferred to expert review and the rest are accepted as pre-labels; and a real robot that removes a cover, looks again, and grasps the target
    papers:
      - "Prediction of Response to Spinal Cord Stimulation Using Machine Learning Based on Radiomics and Patient-Reported Outcomes"
      - "Multimodal Learning for Enhanced Detection in Oral Cancer Screening"

  - id: medical
    title: Image, Video, and 3D Scene Understanding
    summary: Medical imaging, surgical video, human movement, brain connectivity, and indoor scenes seen by robots. We interpret retinal scans, estimate camera motion inside the body, track human pose over time, and build 3D maps from a mobile robot's camera for indoor navigation.
    topics:
      - Foundation and self-supervised models for medical image interpretation
      - Ophthalmic AI for retinal imaging and clinical decision support
      - Surgical AI for workflow understanding and intelligent assistance
      - Human pose estimation and motion analysis from video
      - Graph learning on brain connectivity
      - 3D scene reconstruction and mapping for indoor robot navigation
    figure: overview-medical.svg
    figure_alt: A fundus photograph with the five-level diabetic retinopathy severity scale, retinal layers in OCT, brain regions on an MNI template linked as a graph with the matching connectivity matrix, human pose keypoints across video frames, an endoscope camera trajectory, and a robot camera frame with the 3D Gaussian map built from the robot's video
    papers:
      - "SegSTRONG-C: Segmenting Surgical Tools Robustly On Non-adversarial Generated 'Corruptions', an EndoVis'24 Challenge"
      - "RVO-MIS: Robust Visual Odometry for Minimally Invasive Surgery"
      - "Self-Supervised Graph Transformer with Contrastive Learning for Brain Connectivity Analysis towards Improving Autism Detection"

  - id: reliable
    title: Reliable and Efficient AI Systems
    summary: Models that hold up under distribution shift and still run on the hardware available at the bedside or in the field. We develop test-time adaptation and knowledge distillation methods toward this goal.
    topics:
      - Reliability under distribution and domain shift, including test-time adaptation
      - Knowledge distillation and compact models for resource-constrained deployment
      - Efficient adaptation of foundation models, with simulation and synthetic data
    figure: overview-reliable.svg
    figure_alt: Two routes to compact models (a multi-head attention teacher distilled into a single-head student that fits a real-time budget, and pruning background tokens of a photograph of a statue so the model processes fewer tokens); a shift in feature space between training and deployment data; and a model that adapts on unlabeled images taken in clear, foggy, and rainy weather
    papers:
      - "Efficient Hyperspectral Image Classification Using Discrete Cosine Transform on Limited-Resource Systems"
      - "BCG-Former: Toward Pareto-Efficient Hyperspectral Image Classification via Band-Contextual Gating"

collaborations:
