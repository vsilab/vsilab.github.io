lab_name: Vision Systems and Intelligence Lab
statement: Reliable decisions from limited visual evidence.
intro: >
  We build vision systems that use images, video, and other signals to reason and act with limited
  information and compute. Our research spans surgical and ophthalmic imaging, robotics, and intelligent sensing.

pi:
  name: Eungjoo Lee, Ph.D.
  photo: eungjoo-lee-v3.jpg
  titles:
    - Assistant Professor, School of Electrical, Computing, and Software Engineering
    - Assistant Professor, Department of Ophthalmology and Vision Science
    - Division Chief of Ophthalmic AI, Department of Ophthalmology and Vision Science
    - Director, Vision Systems and Intelligence Laboratory
  bio:
    - >
      Eungjoo Lee is an Assistant Professor in the School of Electrical, Computing, and Software
      Engineering and in the Department of Ophthalmology and Vision Science at the University of Arizona,
      where he is also Division Chief of Ophthalmic AI. In summer 2026 he was a Visiting Researcher at the Schepens Eye
      Research Institute of Massachusetts Eye and Ear, Harvard Medical School. Before joining Arizona he
      was a postdoctoral research fellow in the Department of Radiology at Massachusetts General Hospital
      and Harvard Medical School, affiliated with the Martinos Center for Biomedical Imaging.
    - >
      He received his Ph.D. in Electrical and Computer Engineering from the University of Maryland,
      College Park, and was a research intern at the U.S. Army Research Laboratory. He is affiliated with the Arizona Center for Telemedicine and Digital Health,
      the BIO5 Institute, the University of Arizona Cancer Center, and the Center for Semiconductor
      Manufacturing.
